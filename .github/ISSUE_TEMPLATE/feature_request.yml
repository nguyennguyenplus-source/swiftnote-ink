name: Feature Request
description: Propose a workflow improvement or architectural upgrade for Swift note
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / Workflow Need
      description: Describe the handwriting, PDF annotation, or study workflow limitation you are facing.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution
      description: How should Swift note solve this while preserving canvas-first minimalism and solid opaque UI?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives / References
      description: Mention relevant ideas from Scrble Ink, GoodNotes, Notability, Apple Freeform, or Xournal++.

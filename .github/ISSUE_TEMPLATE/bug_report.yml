name: Bug Report
description: Report a bug or visual/input issue in Swift note
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: dropdown
    id: platform
    attributes:
      label: Operating System & Display Server
      options:
        - Windows 11 (64-bit)
        - Windows 10 (64-bit)
        - Linux (Wayland)
        - Linux (X11)
    validations:
      required: true
  - type: dropdown
    id: layout
    attributes:
      label: Active UI Layout & Theme
      options:
        - B2 · Canvas-First Floating Pill (Light)
        - B2 · Canvas-First Floating Pill (Dark)
        - B1 · Pure Top Bar (Light / Dark)
        - B3 · Zen Header + Bottom Ink Dock (Light / Dark)
        - Blackboard Mode Enabled
  - type: input
    id: input_device
    attributes:
      label: Stylus / Input Device
      placeholder: "e.g., Wacom Intuos, Surface Pen, XP-Pen, Mouse"
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Clear, concise description of the bug and expected behavior.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Swift note
        2. Select tool ...
        3. Observe ...
    validations:
      required: true

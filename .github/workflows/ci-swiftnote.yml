name: Swift note CI (Windows UCRT64 & Linux)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  rust-tests:
    name: Rust Core Tests & Clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Run swiftnote-rs unit tests
        run: cargo test --manifest-path rust/swiftnote-rs/Cargo.toml
      - name: Run swiftnote-rs clippy
        run: cargo clippy --manifest-path rust/swiftnote-rs/Cargo.toml --all-targets -- -D warnings

  linux-build:
    name: Linux Build & Package (Wayland & X11)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build g++ pkg-config gettext help2man lsb-release xvfb \
            appstream shared-mime-info \
            libgtk-3-dev libfontconfig-dev libpoppler-glib-dev poppler-data \
            libxml2-dev libzip-dev librsvg2-dev libsndfile1-dev portaudio19-dev \
            liblua5.4-dev libgtksourceview-4-dev libqpdf-dev libgtest-dev \
            libx11-dev libxi-dev libxext-dev
      - name: Configure CMake
        run: >
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DENABLE_GTEST=ON
          -DDOWNLOAD_GTEST=ON
          -DENABLE_CPPTRACE=OFF
          -DCPACK_GENERATOR="DEB;TGZ"
      - name: Build Swift note & Tests
        run: |
          cmake --build build --target translations --parallel
          cmake --build build --parallel
          xvfb-run -a cmake --build build --target test-units test-gtk-integration --parallel
      - name: Run C++ Unit Tests
        run: CI=true ./build/test/test-units --gtest_brief=1
      - name: Run GTK Regression Test (Xvfb)
        run: xvfb-run -a ./build/test/test-gtk-integration --gtest_filter=SwiftShellRegressionTest.*
      - name: Package Linux (.deb & .tar.gz)
        run: |
          cd build
          cpack -G "DEB;TGZ"
          ls -lh packages/
      - name: Upload Linux Packages
        uses: actions/upload-artifact@v4
        with:
          name: swiftnote-linux-ubuntu2404
          path: |
            build/packages/*.deb
            build/packages/*.tar.gz

  windows-build:
    name: Windows Build & Portable Package (MSYS2 UCRT64)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-imagemagick
            mingw-w64-ucrt-x86_64-gettext
            mingw-w64-ucrt-x86_64-poppler
            mingw-w64-ucrt-x86_64-poppler-data
            mingw-w64-ucrt-x86_64-gtk3
            mingw-w64-ucrt-x86_64-libsndfile
            mingw-w64-ucrt-x86_64-libzip
            mingw-w64-ucrt-x86_64-lua
            mingw-w64-ucrt-x86_64-portaudio
            mingw-w64-ucrt-x86_64-gtksourceview4
            mingw-w64-ucrt-x86_64-qpdf
            mingw-w64-ucrt-x86_64-librsvg
            mingw-w64-ucrt-x86_64-rust
            mingw-w64-ucrt-x86_64-gtest
            patch
            make
      - name: Run Rust unit tests (UCRT64)
        run: cargo test --manifest-path rust/swiftnote-rs/Cargo.toml
      - name: Configure CMake (UCRT64)
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DENABLE_GTEST=ON -DENABLE_CPPTRACE=OFF
      - name: Build Swift note & Tests (UCRT64)
        run: |
          cmake --build build --parallel
          cmake --build build --target test-units --parallel
      - name: Run C++ Unit Tests (UCRT64)
        run: ./build/test/test-units.exe --gtest_brief=1
      - name: Package Portable Windows Distribution
        run: bash windows-setup/package-swiftnote-portable.sh build dist-swiftnote
      - name: Upload Windows Portable Bundle
        uses: actions/upload-artifact@v4
        with:
          name: swiftnote-windows-portable
          path: dist-swiftnote/

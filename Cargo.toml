[workspace]
resolver = "2"
members = [
    "crates/swiftnote-core",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "GPL-3.0-or-later"
repository = "https://github.com/nguyennguyenplus-source/swiftnote-ink"

[workspace.dependencies]
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zip = { version = "9.8", default-features = false, features = ["deflate"] }

proptest = "1.12"
criterion = { version = "0.8", features = ["html_reports"] }

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
